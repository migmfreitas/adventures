<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adventure Log</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #181c27; --surface2: #1f2435;
      --border: #2a3048; --text: #e2e6f0; --muted: #7a849e; --accent: #e07840;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: 56px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    }
    .logo { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; letter-spacing: 0.04em; }
    .logo span { color: var(--accent); }
    .btn {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500;
      padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); cursor: pointer; transition: all .15s; letter-spacing: 0.03em;
    }
    .btn:hover { background: var(--border); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-accent:hover { background: #c86830; }

    .layout { display: flex; height: calc(100vh - 56px); margin-top: 56px; }

    .sidebar { width: 320px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-card { background: var(--surface2); border-radius: 8px; padding: 10px 10px 8px; }
    .stat-val { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; }
    .stat-lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill { font-size: 11px; font-family: 'IBM Plex Mono', monospace; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all .15s; }
    .pill.active { color: #fff; border-color: transparent; }
    .pill[data-type="all"].active  { background: var(--muted); }
    .pill[data-type="bike"].active { background: #9b59b6; }
    .pill[data-type="hike"].active { background: #e07840; }
    .pill[data-type="kayak"].active{ background: #e74c3c; }
    .pill[data-type="run"].active  { background: #f5c842; }
    .pill[data-type="other"].active{ background: #4a9eff; }

    .route-list { flex: 1; overflow-y: auto; padding: 8px; }
    .route-list::-webkit-scrollbar { width: 4px; }
    .route-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .route-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: background .1s; border: 1px solid transparent; }
    .route-item:hover { background: var(--surface2); }
    .route-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .route-emoji { font-size: 14px; flex-shrink: 0; width: 20px; text-align: center; }
    .route-info { flex: 1; min-width: 0; }
    .route-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .route-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .route-arrow { color: var(--muted); font-size: 12px; }

    /* Groups */
    .group-item { margin-bottom: 6px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .group-header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; background: var(--surface2); transition: background .1s; user-select: none; }
    .group-header:hover { background: var(--border); }
    .group-header.open { background: var(--border); }
    .group-icon { font-size: 14px; flex-shrink: 0; }
    .group-info { flex: 1; min-width: 0; }
    .group-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .group-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .group-body { display: none; background: var(--surface); }
    .group-body.open { display: block; }
    .group-desc { padding: 10px 12px 8px; font-size: 12px; color: var(--muted); line-height: 1.6; border-bottom: 1px solid var(--border); }
    .group-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
    .group-stat { background: var(--surface); padding: 8px 10px; }
    .group-stat-val { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; }
    .group-stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
    .group-routes { padding: 4px; }
    .group-routes .route-item { padding-left: 16px; }
    .back-to-all { display: none; align-items: center; gap: 8px; padding: 8px 12px; margin: 0 0 4px; font-size: 12px; color: var(--muted); cursor: pointer; font-family: 'IBM Plex Mono', monospace; border-radius: 6px; transition: color .1s; }
    .back-to-all:hover { color: var(--text); }
    .back-to-all.visible { display: flex; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 12px; text-align: center; padding: 32px 20px; color: var(--muted); }
    .empty-icon { font-size: 36px; opacity: .5; }
    .empty-state p { font-size: 13px; line-height: 1.6; }
    .empty-state strong { color: var(--text); }

    #map { flex: 1; min-height: 0; height: 100%; }

    .map-color-control { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    .map-color-icon { font-size: 12px; line-height: 1; opacity: .75; }
    .map-color-slider { width: 90px; accent-color: var(--accent); cursor: pointer; }

    .leaflet-container { background: #e8e0d8 !important; }
    .leaflet-popup-content-wrapper { background: var(--surface) !important; border: 1px solid var(--border) !important; border-radius: 10px !important; color: var(--text) !important; box-shadow: 0 4px 24px rgba(0,0,0,.4) !important; }
    .leaflet-popup-tip { background: var(--surface) !important; }
    .leaflet-popup-content { margin: 12px 16px !important; font-family: 'Inter', sans-serif !important; }
    .popup-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .popup-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); line-height: 1.8; }
    .popup-link { display: inline-block; margin-top: 10px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--accent); text-decoration: none; }
    .popup-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <div class="logo">adventure<span>.</span>log</div>
  <a class="btn btn-accent" href="admin.html">⌃ Add Route</a>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="stats-row">
        <div class="stat-card"><div class="stat-val" id="statRoutes">—</div><div class="stat-lbl">Routes</div></div>
        <div class="stat-card"><div class="stat-val" id="statKm">—</div><div class="stat-lbl">km total</div></div>
        <div class="stat-card"><div class="stat-val" id="statElev">—</div><div class="stat-lbl">m climbed</div></div>
      </div>
      <div class="filter-row">
        <button class="pill active" data-type="all">All</button>
        <button class="pill" data-type="bike">🚴</button>
        <button class="pill" data-type="hike">🥾</button>
        <button class="pill" data-type="kayak">🛶</button>
        <button class="pill" data-type="run">🏃</button>
        <button class="pill" data-type="other">✦</button>
      </div>
    </div>
    <div class="route-list" id="routeList">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🗺</div>
        <p>No adventures yet.<br/><br/>Click <strong>Add Route</strong> to import a GPX file.</p>
      </div>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/map-color.js?v=1"></script>
<script src="js/gpx-parser.js?v=4"></script>
<script src="js/store.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
