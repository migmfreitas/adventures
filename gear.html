<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gear — Adventure Log</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #181c27; --surface2: #1f2435;
      --border: #2a3048; --text: #e2e6f0; --muted: #7a849e; --accent: #e07840;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
    a { color: inherit; }

    header { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--border); height: 56px; display: flex; align-items: center; padding: 0 20px; gap: 16px; }
    .back-btn { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); transition: all .15s; white-space: nowrap; }
    .back-btn:hover { color: var(--text); }
    .logo { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; letter-spacing: 0.04em; }
    .logo span.dot { color: var(--accent); }
    .btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; transition: all .15s; letter-spacing: 0.03em; text-decoration: none; display: inline-flex; align-items: center; }
    .btn:hover { background: var(--border); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; margin-left: auto; }
    .btn-accent:hover { background: #c86830; }

    .page { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; display: flex; flex-direction: column; gap: 24px; }
    .state-msg { padding: 80px 20px; text-align: center; font-family: 'IBM Plex Mono', monospace; color: var(--muted); font-size: 13px; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 80px 20px; color: var(--muted); }
    .empty-icon { font-size: 40px; opacity: .5; }
    .empty-state p { font-size: 14px; line-height: 1.6; }
    .empty-state strong { color: var(--text); }

    .bike-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; }
    .bike-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .bike-emoji { font-size: 30px; }
    .bike-name { font-size: 20px; font-weight: 600; }
    .bike-sub { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 2px; }

    .bike-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
    .bike-stat { background: var(--surface2); padding: 12px 14px; }
    .bike-stat-val { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; }
    .bike-stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }

    .details-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
    .details-card table { width: 100%; border-collapse: collapse; }
    .details-card tr { border-bottom: 1px solid var(--border); }
    .details-card tr:last-child { border-bottom: none; }
    .details-card td { padding: 10px 14px; font-size: 13px; }
    .details-card td:first-child { color: var(--muted); width: 40%; }
    .details-card td:last-child { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }

    .bike-notes { font-size: 13.5px; line-height: 1.6; color: var(--text); margin-bottom: 18px; }

    .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }

    .log-list { display: flex; flex-direction: column; gap: 2px; }
    .log-entry { display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .log-entry:last-child { border-bottom: none; }
    .log-entry-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); width: 96px; flex-shrink: 0; padding-top: 1px; }
    .log-entry-body { flex: 1; min-width: 0; }
    .log-entry-title { font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .log-entry-desc { font-size: 13px; color: var(--text); margin-top: 4px; line-height: 1.5; }
    .log-entry-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 4px; }
    .log-empty { color: var(--muted); font-size: 12.5px; padding: 8px 0; }

    .ride-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
    .ride-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; transition: opacity .15s; }
    .ride-row:hover { opacity: .75; }
    .ride-row:last-child { border-bottom: none; }
    .ride-row-info { min-width: 0; }
    .ride-row-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ride-row-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .ride-row-dist { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--accent); flex-shrink: 0; }

    @media (max-width: 560px) {
      .bike-stats { grid-template-columns: 1fr 1fr; }
      .log-entry { flex-direction: column; gap: 4px; }
      .log-entry-date { width: auto; }
    }
  </style>
</head>
<body>

<header>
  <a class="back-btn" href="index.html">← Map</a>
  <div class="logo">adventure<span class="dot">.</span>log</div>
  <a class="btn btn-accent" href="gear-admin.html">⌃ Manage gear</a>
</header>

<div class="page" id="gearRoot">
  <div class="state-msg">Loading…</div>
</div>

<script src="js/gear.js"></script>
</body>
</html>
